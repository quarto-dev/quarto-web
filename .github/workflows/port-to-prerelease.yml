name: Port change to prerelease
on:
  pull_request_target:
    types: [closed]
  issue_comment:
    types: [created]

permissions: {} # each job opts in below

jobs:
  sync-to-prerelease:
    name: Backport pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write # so it can comment
      pull-requests: write # so it can create, merge and label pull requests
      checks: write # so it can create a check run
    # Don't run on closed unmerged pull requests and only PRs to main,
    # skipping PRs labeled 'no-sync-prerelease' (e.g. release merges that
    # would otherwise try to cherry-pick the whole prerelease history back).
    # Also runs on a '/sync-prerelease' comment, ignoring the Github Action Bot.
    if: > 
      (
        github.event.pull_request.merged && 
        github.event.pull_request.base.ref == 'main' &&
        !contains(github.event.pull_request.labels.*.name, 'no-sync-prerelease')
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.id != 41898282 &&
        startsWith(github.event.comment.body, '/sync-prerelease')
      )
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # backport-action pushes with these and has no token of its own

      - name: Create backport pull requests
        id: synced-pr
        # https://github.com/korthout/backport-action/releases/tag/v4.6.0
        uses: korthout/backport-action@2e830a1d0b8269505846ddd407a70876913ad1f8 # v4.6.0
        with:
          cherry_picking: auto
          branch_name: sync-${pull_number}-to-${target_branch}
          merge_commits: skip
          pull_title: '[Sync to ${target_branch}] ${pull_title}'
          pull_description: |
            # Description
            Sync of #${pull_number} to `${target_branch}`.

            ## Original PR

            ### ${pull_title}
            ${pull_description}
          # Don't trigger on labels, and always PR to prerelease
          label_pattern: ''
          target_branches: prerelease

      # Merging right away keeps prerelease up to date before the next PR to
      # main is cherry-picked; a sync PR left open makes the next backport
      # touching the same file conflict.
      - name: Merge the sync pull request
        id: merge
        if: steps.synced-pr.outputs.was_successful == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_PR: ${{ steps.synced-pr.outputs.created_pull_numbers }}
        run: |
          gh pr merge "$SYNC_PR" --repo "$GITHUB_REPOSITORY" --squash
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Remove the backport-failed label
        if: steps.synced-pr.outputs.was_successful == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if gh pr view "$SOURCE_PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx backport-failed; then
            gh pr edit "$SOURCE_PR" --repo "$GITHUB_REPOSITORY" --remove-label backport-failed
          fi

      # Also when the sync PR could not be merged, e.g. prerelease moved and
      # it now conflicts; it stays open for a manual merge.
      - name: Label the failed backport
        if: >
          !cancelled() && (
            steps.synced-pr.outputs.was_successful == 'false' ||
            steps.merge.outcome == 'failure'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: gh pr edit "$SOURCE_PR" --repo "$GITHUB_REPOSITORY" --add-label backport-failed

  # Merging with GITHUB_TOKEN does not trigger the push event that publishes
  # prerelease, so publish it explicitly. Publishing the branch tip rather than
  # the merge commit keeps the latest content when two syncs land together.
  publish-prerelease:
    needs: [ sync-to-prerelease ]
    # Publish even if a later step of the sync job failed after the merge.
    if: ${{ !cancelled() && needs.sync-to-prerelease.outputs.merged == 'true' }}
    uses: ./.github/workflows/publish.yml
    # A called workflow cannot exceed its caller's grant.
    permissions:
      contents: read
      statuses: write
    with:
      ref: prerelease
      prerelease: true
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  # A backport that failed because an earlier change was missing from
  # prerelease can apply once that change lands. After a sync merge, or a
  # manual merge into prerelease, retry the oldest failed backport. Each
  # successful retry triggers the next one; the chain stops at the first
  # backport that fails again.
  retry-failed-backport:
    name: Retry the oldest failed backport
    needs: [ sync-to-prerelease ]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # so it can list labeled pull requests
    if: >
      !cancelled() && (
        needs.sync-to-prerelease.outputs.merged == 'true' || (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.merged &&
          github.event.pull_request.base.ref == 'prerelease'
        )
      )
    steps:
      - name: Find the oldest PR labeled backport-failed
        id: oldest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state merged --label backport-failed --limit 1000 --json number,mergedAt --jq 'sort_by(.mergedAt) | .[0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Re-run its backport with a comment
        if: steps.oldest.outputs.pr != ''
        env:
          # special fine-grained token for issue comment trigger
          GH_TOKEN: ${{ secrets.ISSUE_COMMENT_TRIGGER_PAT }}
          RETRY_PR: ${{ steps.oldest.outputs.pr }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/$RETRY_PR/comments" -f body="/sync-prerelease"