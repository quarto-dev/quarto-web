# Scans quarto.org and prerelease.quarto.org with axe and publishes each
# site's results page. axe-scan.yml does the work for one branch.
#
# A scheduled run always uses the copy of this file on the default branch
# (main), so that copy controls both scans.
name: Axe Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions: {} # each job opts in below

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { branch: main, site: quarto.org, prerelease: false }
          - { branch: prerelease, site: prerelease.quarto.org, prerelease: true }
    # One scan per branch at a time; the two branches run in parallel.
    concurrency:
      group: axe-report-${{ matrix.branch }}
      cancel-in-progress: false
    uses: ./.github/workflows/axe-scan.yml
    # A called workflow cannot exceed its caller's grant.
    permissions:
      contents: write
      statuses: write
    with:
      branch: ${{ matrix.branch }}
      site: ${{ matrix.site }}
      prerelease: ${{ matrix.prerelease }}
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
