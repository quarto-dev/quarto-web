on:
  pull_request:
    branches: [main, prerelease]
    paths-ignore:
      - '.github/**'
  issue_comment:
    types: [created]

name: Deploy Preview

permissions: {} # each job opts in below

concurrency:
  # Use github.event.pull_request.number on pull requests, so it's unique per pull request
  # Use github.event.issue.number on issue comments, so it's unique per comment
  # Use github.ref on other branches, so it's unique per branch
  group: ${{ github.workflow }}-${{ (github.event.pull_request && format('PR-{0}', github.event.pull_request.number)) || ( github.event.issue && format('comment-{0}', github.event.issue.number) ) || github.ref }}
  cancel-in-progress: true

jobs:
  is-external-pr:
    # Be helpful with reviewer and remind them to trigger a deploy preview if the PR is from a fork.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
    runs-on: ubuntu-latest
    permissions: {} # only writes an annotation
    steps:
      - name: Error with message for manual deploy
        run: |
          echo "::error title=Manual action required for preview::PR from fork can't be deployed as preview to Netlify automatically. Use '/deploy-preview' command in comments to trigger the preview manually."
        shell: bash

  build-deploy-preview:
    # Deploy a preview only if 
    # - the PR is not from a fork,
    # - requested by PR comment /deploy-preview, from a repo user or github action bot (user id 41898282)
    # FIXME: We need to change the way we filter because somehow some MEMBER in API are seen as CONTRIBUTOR in CI
    if: >
      (
        github.event_name == 'pull_request' && 
        github.event.pull_request.head.repo.fork != true
      ) || 
      (
        github.event.issue.pull_request && 
        (
          github.event.comment.user.id == '41898282' ||
          github.event.comment.user.login == 'gordonwoodhull' ||
          github.event.comment.author_association == 'MEMBER' || 
          github.event.comment.author_association == 'OWNER' || 
          github.event.comment.author_association == 'COLLABORATOR'
        ) && 
        startsWith(github.event.comment.body, '/deploy-preview')
      ) 
      
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write # for the Netlify deploy status
      pull-requests: write # so it can post the preview comment
    outputs:
      # Consumed by the `axe` job below, which runs after the deploy.
      quarto_version: ${{ steps.github-release.outputs.version }}
      axe_pages: ${{ steps.pr-comment.outputs.axe_pages }}
      axe_full: ${{ steps.axe-full.outputs.any_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/merge
          persist-credentials: false # nothing here pushes

      # On issue_comment events (e.g. /deploy-preview), github.event.pull_request
      # is not populated so tj-actions/changed-files can't determine the base commit
      # to diff against. Fetch it from the API so we can pass it explicitly.
      - name: Get PR base SHA
        if: github.event_name != 'pull_request'
        id: pr-info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          base_sha=$(gh -R "$GITHUB_REPOSITORY" pr view "$PR_NUMBER" --json baseRefOid --jq '.baseRefOid')
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Get latest pre-release from github
        id: github-release
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo version=$(gh api repos/quarto-dev/quarto-cli/releases | jq -r 'map(select(.prerelease)) | first | .tag_name | sub("^v";"")') >> "$GITHUB_OUTPUT"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ steps.github-release.outputs.version }}

      - name: Is it for prerelease website ?
        id: prerelease-docs-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$PR_BASE_REF" == "prerelease" ]; then
            echo "is_prerelease_docs=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$ISSUE_PR_URL" ]; then
            # This will trigger when not pull request event, so a PR comment event.
            # we need to get the base info from PR number the comment is made in
            base_ref=$(gh -R "$GITHUB_REPOSITORY" pr view "$ISSUE_NUMBER" --json baseRefName --jq '.baseRefName')
            if [ "$base_ref" == "prerelease" ]; then
              echo "is_prerelease_docs=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease_docs=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "is_prerelease_docs=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2
        env:
          QUARTO_PROFILE: ${{ steps.prerelease-docs-check.outputs.is_prerelease_docs == 'true' && 'prerelease-docs,pr-preview' || 'pr-preview' }}

      - name: Deploy Preview to Netlify as preview
        id: netlify-deploy
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0.0
        env:
          NETLIFY_SITE_ID: 2a3da659-672b-4e5b-8785-e10ebf79a962
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        with:
          publish-dir: './_site'
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: |
            Deploy from GHA: ${{ github.event.pull_request.title || format('manual from PR {0}', github.event.issue.number) }}
          alias: deploy-preview-${{ github.event.pull_request.number || github.event.issue.number }}
          # these all default to 'true'
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-commit-status: true
          overwrites-pull-request-comment: false
        timeout-minutes: 1

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          base_sha: ${{ github.event.pull_request.base.sha || steps.pr-info.outputs.base_sha }}
          files: |
            # don't consider modifications on file used for includes for now.
            license.qmd
            docs/**/[^_]*.qmd
            docs/**/[^_]*.md
            docs/**/*.yml
            docs/reference/**/*.json
            docs/cli/*.json
            docs/**/images/*.png
          files_ignore: |
            **/CLAUDE.md
            docs/**/_*/**
            docs/_*/**
          json: true
          escape_json: false

      # A change to any of these can reach every page, so the axe job scans
      # the whole site instead of the changed pages.
      - name: Check for site-wide changes
        id: axe-full
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          base_sha: ${{ github.event.pull_request.base.sha || steps.pr-info.outputs.base_sha }}
          files: |
            _quarto*.yml
            _brand.yml
            _axe-baseline.json
            **/*.scss
            **/*.css
            _extensions/**
            docs/**/_metadata.yml
            **/_*.md
            **/_*.qmd
            docs/**/_*/**
          # The weekly report workflow commits this file, and release merges
          # carry it. It changes one page only, so it needs no full scan.
          files_ignore: _axe-report.md

      - name: Map changed images to doc pages
        id: image-pages
        env:
          CHANGED: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          # Build JSON mapping from image output paths to doc pages using manifest
          MANIFEST="_tools/screenshots/manifest.json"
          if [ -f "$MANIFEST" ]; then
            # Extract {output: doc.file} pairs, match against changed files
            IMAGE_PAGES=$(echo "$CHANGED" | jq -r --slurpfile manifest "$MANIFEST" '
              ($manifest[0].screenshots | map(select(.doc.file) | {(.output): .doc.file}) | add // {}) as $map |
              [.[] | select(test("[.]png$")) |
                # Normalize dark variants (foo-dark.png -> foo.png) for manifest lookup
                sub("-dark[.]png$"; ".png") as $base |
                ($map[$base] // empty) | sub("[.]qmd$"; ".html")
              ] | unique | .[]
            ')
            echo "pages<<EOF" >> "$GITHUB_OUTPUT"
            echo "$IMAGE_PAGES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Create custom PR comment
        id: pr-comment
        if: github.event.pull_request || github.event.issue.pull_request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_URL: ${{ steps.netlify-deploy.outputs.deploy-url }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          IMAGE_PAGES: ${{ steps.image-pages.outputs.pages }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request?.number || context.payload.issue.number;
            const deployUrl = process.env.DEPLOY_URL;
            const changedFiles = JSON.parse(process.env.CHANGED_FILES || '[]');
            // Every page this PR touches, for the `axe` job's --pages
            const axePages = new Set();

            let commentBody = `## 📝 Preview Deployment\n\n`;
            commentBody += `🔍 Full site preview: [${deployUrl}](${deployUrl})\n\n`;

            if (changedFiles.length > 0) {
              // Explicit mapping for files that don't follow standard naming conventions
              const specialFileMapping = {
                // Extensions listings → extensions index
                'docs/extensions/listings/shortcodes-and-filters.yml': 'docs/extensions/index.html',
                'docs/extensions/listings/journal-articles.yml': 'docs/extensions/index.html',
                'docs/extensions/listings/custom-formats.yml': 'docs/extensions/index.html',
                'docs/extensions/listings/revealjs-formats.yml': 'docs/extensions/index.html',
                'docs/extensions/listings/revealjs.yml': 'docs/extensions/index.html',
                // Gallery data files → gallery index
                'docs/gallery/carousel.yml': 'docs/gallery/index.html',
                'docs/gallery/gallery.yml': 'docs/gallery/index.html',
                // Guide listing → guide index
                'docs/guide/guide.yml': 'docs/guide/index.html',
                // Download data → download index
                'docs/download/_download-older.yml': 'docs/download/index.html',
                // Reference data files → reference section indexes
                'docs/reference/reference.yml': 'docs/reference/index.html',
                'docs/reference/cells/reference.yml': 'docs/reference/cells/index.html',
                'docs/reference/formats/reference.yml': 'docs/reference/formats/index.html',
                'docs/reference/metadata/reference.yml': 'docs/reference/metadata/index.html',
                'docs/reference/projects/reference.yml': 'docs/reference/projects/index.html',
                // CLI data → reference index
                'docs/cli/cli-info.json': 'docs/reference/index.html',
              };

              // Projects/ JSON files have many-to-one mapping to .qmd pages
              const projectsJsonMapping = {
                'book': 'docs/reference/projects/books.html',
                'manuscript': 'docs/reference/projects/manuscripts.html',
                'project': 'docs/reference/projects/options.html',
                'preview': 'docs/reference/projects/options.html',
                'serve': 'docs/reference/projects/options.html',
              };
              const projectsDefault = 'docs/reference/projects/websites.html';

              // Resolve each changed file to its preview URL path
              // Group files by their target page for deduplication
              const pageToFiles = new Map();

              changedFiles.forEach(file => {
                let fileUrlPath;

                if (specialFileMapping[file]) {
                  fileUrlPath = specialFileMapping[file];
                } else if (file.endsWith('.qmd') || file.endsWith('.md')) {
                  fileUrlPath = file.replace(/\.(qmd|md)$/, '.html');
                } else if (file.startsWith('docs/reference/projects/') && file.endsWith('.json')) {
                  const stem = file.split('/').pop().replace('.json', '');
                  fileUrlPath = projectsJsonMapping[stem] || projectsDefault;
                } else if (file.endsWith('.json')) {
                  // Generic: formats/, cells/, metadata/ JSON have sibling .qmd files
                  fileUrlPath = file.replace(/\.json$/, '.html');
                }

                if (fileUrlPath) {
                  if (!pageToFiles.has(fileUrlPath)) {
                    pageToFiles.set(fileUrlPath, []);
                  }
                  pageToFiles.get(fileUrlPath).push(file);
                }
              });

              if (pageToFiles.size > 0) {
                commentBody += `### 🔄 Modified Documents\n\n`;
                for (const [page, files] of pageToFiles) {
                  axePages.add(page);
                  const fileUrl = `${deployUrl}/${page}`;
                  if (files.length === 1) {
                    commentBody += `- [${page}](${fileUrl})\n`;
                  } else {
                    // Multiple source files map to one page - show page with file summary
                    const basenames = files.map(f => f.split('/').pop());
                    const shown = basenames.slice(0, 3).join(', ');
                    const rest = basenames.length > 3 ? `, +${basenames.length - 3} more` : '';
                    commentBody += `- [${page}](${fileUrl}) (${shown}${rest})\n`;
                  }
                }
              }
            }

            // Add pages affected by changed screenshots
            const imagePages = (process.env.IMAGE_PAGES || '').trim();
            if (imagePages) {
              const pages = [...new Set(imagePages.split('\n').filter(Boolean))];
              if (pages.length > 0) {
                commentBody += `\n### 🖼️ Pages with Updated Screenshots\n\n`;
                for (const page of pages) {
                  axePages.add(page);
                  const fileUrl = `${deployUrl}/${page}`;
                  commentBody += `- [${page}](${fileUrl})\n`;
                }
              }
            }

            core.setOutput('axe_pages', [...axePages].sort().join(','));

            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

      # The `axe` job scans this render instead of rendering again. One tar
      # file uploads much faster than the thousands of files in _site.
      # These steps come after the PR comment, so the preview links are not
      # delayed.
      - name: Pack the rendered site for the axe scan
        run: tar -cf site.tar _site

      - name: Upload the rendered site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site.tar
          retention-days: 1
          overwrite: true # a re-run uploads again

  axe:
    # Scan the preview render with `quarto call axe`. Runs after the deploy
    # and the PR comment, so the preview is not delayed by it. Scans only the pages the
    # PR touches, or the whole site when a change can reach every page.
    # See accessibility/site-report.qmd and .github/workflows/axe-report.yml.
    name: Axe accessibility scan
    needs: [build-deploy-preview]
    if: >
      needs.build-deploy-preview.outputs.axe_full == 'true' ||
      needs.build-deploy-preview.outputs.axe_pages != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # so it can post the scan comment
    steps:
      # The scanner reads _axe-baseline.json from the project root.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/merge
          persist-credentials: false # nothing here pushes

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ needs.build-deploy-preview.outputs.quarto_version }}

      - name: Download the rendered site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site

      - name: Unpack the rendered site
        run: tar -xf site.tar

      - name: Scan with axe
        id: scan
        env:
          AXE_FULL: ${{ needs.build-deploy-preview.outputs.axe_full }}
          AXE_PAGES: ${{ needs.build-deploy-preview.outputs.axe_pages }}
        # _axe-exclude.txt lists the pages to skip and why. The
        # excludes apply after --pages, so a PR that edits one of them is
        # not blocked.
        run: |
          AXE_EXCLUDE=$(grep -v -e '^#' -e '^[[:space:]]*$' _axe-exclude.txt | paste -sd, -)
          if [ "$AXE_FULL" != "true" ]; then
            # Keep only the pages that rendered. A changed file can be a
            # README, a file in an example sub-project, or a deleted page.
            AXE_PAGES=$(tr ',' '\n' <<< "$AXE_PAGES" | while read -r page; do
              if [ -f "_site/$page" ]; then echo "$page"; fi
            done | paste -sd, -)
            if [ -z "$AXE_PAGES" ]; then
              echo "No changed page rendered: nothing to scan"
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          set +e
          if [ "$AXE_FULL" = "true" ]; then
            echo "Site-wide change: scanning the whole site"
            quarto call axe _site --exclude "$AXE_EXCLUDE" --fail-on serious
          else
            echo "Scanning changed pages: $AXE_PAGES"
            quarto call axe _site --pages "$AXE_PAGES" --exclude "$AXE_EXCLUDE" --fail-on serious
          fi
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0: complete, nothing new at or above serious.
          # 1: new serious or critical findings. Fix them, or accept them in
          #    _axe-baseline.json with a note that says why.
          # 2: the scan did not complete, so it cannot pass.
          exit "$code"

      - name: Write the report to the job summary
        if: always() && steps.scan.outputs.exit_code != ''
        # A scan that exits 2 early may not write the report.
        run: |
          [ -f _axe-checks/report.md ] && cat _axe-checks/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload scan artifacts
        if: always() && steps.scan.outputs.exit_code != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axe-checks
          path: _axe-checks/
          retention-days: 14

      # Like the preview comment, this posts a new comment on every run.
      - name: Comment with the scan result
        if: always() && (steps.scan.outputs.exit_code != '' || steps.scan.outputs.skipped == 'true')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
          SKIPPED: ${{ steps.scan.outputs.skipped }}
          AXE_FULL: ${{ needs.build-deploy-preview.outputs.axe_full }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request?.number || context.payload.issue.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const full = process.env.AXE_FULL === 'true';
            const code = process.env.EXIT_CODE;

            let findings = null;
            if (fs.existsSync('_axe-checks/findings.json')) {
              findings = JSON.parse(fs.readFileSync('_axe-checks/findings.json', 'utf8'));
            }

            let body = `## ♿ Accessibility Scan (axe)\n\n`;

            if (process.env.SKIPPED === 'true') {
              body += `⏭️ No changed page rendered, so there was nothing to scan.\n`;
            } else {
              if (code === '0') {
                body += `✅ No new serious or critical findings.\n\n`;
              } else if (code === '1') {
                body += `❌ New serious or critical findings. Fix them, or accept them in \`_axe-baseline.json\` with a note that says why.\n\n`;
              } else {
                body += `⚠️ The scan did not complete (exit code ${code}). See the [run log](${runUrl}).\n\n`;
              }

              if (findings) {
                const pages = findings.pages.map(p => p.output);
                const newFindings = findings.findings.filter(f => !f.baselined);
                const baselined = findings.findings.length - newFindings.length;
                const cells = findings.cells;
                body += full
                  ? `**Scope:** whole site (site-wide change), ${pages.length} pages\n\n`
                  : `**Scope:** ${pages.length} changed page${pages.length === 1 ? '' : 's'}\n\n` +
                    pages.map(p => `- ${p}`).join('\n') + `\n\n`;
                body += `**Result:** ${newFindings.length} new finding${newFindings.length === 1 ? '' : 's'} (any impact), ` +
                  `${baselined} baselined, ${cells.ok}/${cells.total} page × mode × viewport checks completed\n\n`;

                if (newFindings.length > 0) {
                  const max = 20;
                  body += `| rule | impact | pages | instances |\n|---|---|---:|---:|\n`;
                  for (const f of newFindings.slice(0, max)) {
                    body += `| [\`${f.rule}\`](${f.helpUrl}) | ${f.impact} | ${f.pages.length} | ${f.instances} |\n`;
                  }
                  if (newFindings.length > max) {
                    body += `\n…and ${newFindings.length - max} more.\n`;
                  }
                  body += `\n`;
                }
              }
              body += `📄 [Full report](${runUrl}) in the job summary, and \`findings.json\` in the \`axe-checks\` artifact.\n`;
            }

            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
