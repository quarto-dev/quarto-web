# Runs the unit tests for the local release-info action.
name: Test release-info action

on:
  pull_request:
    paths: ['.github/workflows/actions/release-info/**']
  push:
    branches: [main, prerelease]
    paths: ['.github/workflows/actions/release-info/**']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Matches the node24 runtime declared in the action's action.yml.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run action tests
        working-directory: .github/workflows/actions/release-info
        run: npm test
