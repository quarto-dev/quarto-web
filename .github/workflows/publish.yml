on:
  workflow_dispatch:
  push:
    branches: 
      - main
      - prerelease
  workflow_call:
    inputs:
      ref: 
        required: true
        description: 'The branch to publish; its tip is checked out when the job starts'
        type: string
      prerelease:
        required: true
        description: 'Whether to deploy prerelease or release site'
        type: boolean
        default: false
    secrets:
      NETLIFY_AUTH_TOKEN:
        required: true
        description: 'Netlify token used to deploy both the production and prerelease sites'

name: Quarto Publish

permissions:
  contents: read
  statuses: write # for the Netlify deploy status

concurrency:
  # One group per deployed site, whichever workflow calls it, so an older
  # build cannot finish last and overwrite a newer deploy. Each run checks
  # out the branch tip, so the run that wins includes every earlier change.
  # Same site selection as the deploy steps: an explicit prerelease input wins
  # over the caller's ref. A run that deploys neither site (a dispatch from
  # another branch) gets its own group, so it never cancels a deploy.
  group: ${{ format('publish - {0}', (inputs.prerelease || (format('{0}', inputs.prerelease) != 'false' && github.ref == 'refs/heads/prerelease')) && 'prerelease' || (format('{0}', inputs.prerelease) == 'false' || github.ref == 'refs/heads/main') && 'main' || github.ref) }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip, not the triggering commit: a run that cancels an
          # older one must not deploy older content than it.
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false # deploys with NETLIFY_AUTH_TOKEN, never pushes

      - name: Get latest pre-release from github
        id: github-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Retry a few times in case the API returns transient nulls
          for i in 1 2 3 4 5; do
            version="$(
              gh api repos/quarto-dev/quarto-cli/releases \
              | jq -r '
                  map(select(.prerelease == true and (.tag_name? // "") != "")) 
                  | first 
                  | .tag_name? 
                  // empty
                  | sub("^v";"")
                '
            )" || true

            if [ -n "${version:-}" ]; then
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt $i: prerelease version not resolved; retrying..." >&2
            sleep 2
          done

          echo "Failed to resolve prerelease version after retries." >&2
          exit 1

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ steps.github-release.outputs.version }}

      - name: Render 
        uses: quarto-dev/quarto-actions/render@v2
        env:
          QUARTO_PROFILE: ${{ (inputs.prerelease || (format('{0}', inputs.prerelease) != 'false' && contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/prerelease')) && 'prerelease-docs' || '' }}

      - name: Publish release website
        # Only do this step if 
        # - workflow is called for release deploy, with inputs.prerelease being false. It should not trigger if inputs.prerelease is null.
        #   and in GHA null == false is true. That is why we convert to string and compare.
        # - workflow is triggered by push event on main branch
        # - workflow is triggered by workflow_dispatch event 
        #   (we need to protect also from workflow_dispatch inherited from workflow_call event - where inputs.prerelease is defined)
        if: ${{ format('{0}', inputs.prerelease) == 'false' || (!inputs.prerelease && contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main') }}
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: netlify
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          render: false

      - name: Deploy Prerelease website to Netlify
        # Only do this step if 
        # - workflow is called for release deploy with inputs.prerelease being true. It should not trigger if inputs.prerelease is null.
        #   Though as in GHA null means false, no need to cast to string
        # - workflow is triggered by push event on main branch
        # - workflow is triggered by workflow_dispatch event 
        #   (we need to protect also from workflow_dispatch inherited from workflow_call event - where inputs.prerelease is defined)
        if: ${{ inputs.prerelease || (format('{0}', inputs.prerelease) != 'false' && contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/prerelease') }}
        id: netlify-deploy
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0.0
        env:
          NETLIFY_SITE_ID: 2a3da659-672b-4e5b-8785-e10ebf79a962
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        with:
          publish-dir: './_site'
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: |
            Deploy from GHA: ${{ format('manual from {0} at commit {1}', github.ref_name, github.sha) }}
          alias: prerelease
          # these all default to 'true'
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-commit-status: true
          overwrites-pull-request-comment: false
        timeout-minutes: 1