rules:
  unpinned-uses:
    config:
      # quarto-dev and r-lib may use a moving major tag; everything else is hash-pinned.
      policies:
        "quarto-dev/*": ref-pin
        "r-lib/*": ref-pin
        "*": hash-pin

  dangerous-triggers:
    ignore:
      - port-to-prerelease.yml # needs write access to open the sync PR
      - preview.yml # /deploy-preview comment command is gated on comment author_association (MEMBER/OWNER/COLLABORATOR)
