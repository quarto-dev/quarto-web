# Applies to every page under docs/gallery/.
#
# Live-link hover preview: remove the include-after-body line to disable it;
# to remove it, also delete the include it names. Nothing else references it.
body-classes: gallery
toc: false
# The pages show their subtitle; the description stays in the page metadata.
hide-description: true
include-after-body: ../../_extensions/quartoorg/assets/scripts/gallery/preview.html
# Widen the card grid and shrink the listing category facet (default
# margin-width is 300px). Replaces per-page `page-layout: full`: grid
# body-width governs the content band on its own.
grid:
  body-width: 1200px
  margin-width: 180px
