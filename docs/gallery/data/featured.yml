# Landing-page data: 6 categories, meta + up to 3 curated cards each.
# Hand-written and fully curated; _featured.ejs.md renders the first 3 cards.
# Each category's `capabilities` are the single source for the "Learn the Quarto
# features used" links, shown on the landing (_featured.ejs.md) and pulled onto the
# matching spoke page via a _caps.ejs.md listing filtered by `slug`.
# NOTE (scaffold): these cards mirror the first entries in the per-category
# lists (<category>.yml); a later pass can single-source those too.

- category: Reports & Analytics
  slug: reports
  anchor: reports-analytics
  page: reports-analytics.qmd
  icon: "bar-chart-line"
  gap: "finance · government report"
  tagline: Communicate analysis so a decision-maker can act.
  capabilities:
    - text: Parameters
      href: /docs/computations/parameters.qmd
    - text: Typst
      href: /docs/output-formats/typst.qmd
    - text: Dashboards
      href: /docs/dashboards/index.qmd
  cards:
    - name: World Happiness Report
      title: Report annually to stakeholders
      author: Isabel Velásquez
      live: https://github.com/ivelasq/whr-typst-template/blob/main/template.pdf
      code: https://github.com/ivelasq/whr-typst-template
      categories: [report, pdf, typst, r]
      features: [brand.yml]
      image: thumbnails/reports-analytics/whr.png
      alt: World Happiness Report branded Typst cover page.
      description: Branded front page and branded computational outputs.
    - name: TFFF · OBTN 2025
      title: Generate many customised reports
      author: David Keyes / Clarity Data Studio
      live: https://www.tfff.org/wp-content/uploads/Linn_OBTN-2025_EN.pdf
      code: https://claritydatastudio.com
      categories: [report, pdf]
      features: [Parameters, brand.yml]
      image: thumbnails/reports-analytics/tfff.png
      alt: Branded Linn County report page with parameterised statistics, a map, and charts.
      description: Parameterised, branded PDF reports produced at scale.
    - name: Closeread story
      title: Walk a reader through findings
      author: Nicola Rennie
      live: https://nrennie.rbind.io/scrollytelling/
      code: https://github.com/nrennie/scrollytelling
      categories: [article, html, r]
      features: [Closeread, interactive]
      image: thumbnails/reports-analytics/closeread.png
      preview: thumbnails/featured/reports-analytics-closeread
      preview-url: https://nrennie.rbind.io/scrollytelling/posts/chart-styling/
      alt: Closeread scrollytelling story with a sticky narrative beside linked small-multiple charts.
      description: Scrollytelling data story with the Closeread extension.

