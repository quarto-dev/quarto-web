title: quarto.org website
author: Quarto
version: 1.0.0
quarto-required: ">=1.9.0"
contributes:
  formats:
    html:
      toc: true
      theme:
        light: [cosmo, scss/quartoorg.scss]
        dark: [cosmo, scss/quartoorg-dark.scss]
      code-copy: true
      code-overflow: wrap
      include-in-header:
        - assets/scripts/supported-by-posit.html
      include-after-body:
        - assets/scripts/page-tweaks.html
      grid:
        sidebar-width: 250px
        body-width: 900px
        margin-width: 300px
      shortcodes:
        - shortcodes/page-chooser.lua
      filters:
        - filters/tools-tabset.lua
        - filters/color-box.lua
        - filters/shift-headings.lua
        - at: post-quarto
          path: filters/include-dark.lua
  project:
    project:
      type: website
    website:
      image: /assets/images/quarto-dark-bg.jpeg
      plausible-analytics:
        path: assets/scripts/plausible.html
      open-graph: true
      twitter-card: true
      repo-actions: [edit, issue]
      page-navigation: true
      bread-crumbs: true
      search:
        show-item-context: true
        type: overlay
      navbar:
        background: light
        logo: /assets/images/quarto.png
        logo-alt: "Quarto logo."
        title: false
        collapse-below: lg
    syntax-highlighting: a11y
    respect-user-color-scheme: true
    format: quartoorg-html
